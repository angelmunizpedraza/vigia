[project]
name = "vigia"
version = "0.1.0"
description = "Ten computer-vision systems for real-world problems, on a laptop CPU, with no AGPL models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ángel Muñiz Pedraza" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    # Runs D-FINE on Intel NPUs: D-FINE-M 22 ms vs 362 ms on the CPU of a Core Ultra 7 258V.
    "openvino>=2025.0",
    "opencv-contrib-python>=4.10",
    "pillow>=10",
    # 0.30+ pulls PyAV, whose wheels bundle FFmpeg built with GPL x264/x265. 0.29.1 is the last without it.
    "supervision==0.29.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
pose = ["rtmlib>=0.0.16"]
face = ["mediapipe>=1.2.3,<2"]
arduino = ["pyserial>=3.5"]

[project.scripts]
vigia = "vigia.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigia"]

[tool.uv]
# supervision wants opencv-python, rtmlib/mediapipe want opencv-contrib-python; both ship `cv2`.
# Keep only the contrib build (a superset).
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
markers = ["slow: needs downloaded models or sample videos"]
testpaths = ["tests"]
